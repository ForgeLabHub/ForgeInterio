# Явная конфигурация: результат линта не зависит от настроек машины разработчика
# и от того, какой ruff лежит первым в PATH. Версия закреплена в
# requirements-dev.txt (ruff==0.8.4).
#
# Правила подобраны так, чтобы проверка была полезна и проходима: ошибки
# (E), потенциальные баги (F). Строгие наборы (BLE/SIM/PLW) в легаси-коде
# заказчика дают десятки замечаний стиля; они вынесены в задачу постепенного
# ужесточения, см. docs/development/code-style.md.
line-length = 100
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
